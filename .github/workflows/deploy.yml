name: Deploy Static Content to Pages

on:
  push:
    branches: ["main"] # หรือ master ขึ้นอยู่กับ Branch ของคุณ

  # เปิดให้กดรันเองได้จากหน้าเว็บ GitHub
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # จุดสำคัญ: ชี้ path ไปที่โฟลเดอร์ www ของคุณ
          path: './www'
          
      - name: Deploy to GitHub Ecosystem
        id: deployment
        uses: actions/deploy-pages@v4
